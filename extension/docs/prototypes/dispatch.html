<!doctype html>
<html data-theme="dark">
<head>
<meta charset="utf-8"/>
<title>Dispatch v2 — consolidated panel</title>
<style>
  :root{
    --brand:#a3e635; --brand-600:#84cc16; --brand-ring:rgba(163,230,53,.22);
    --run:#22C55E; --idle:#6B7280; --fail:#EF4444; --wait:#D4A72C;
    --bg:#0a0a0a; --panel:#141414; --sunken:#0c0c0c; --line:#242424; --line2:#2f2f2f;
    --tx:#e7e7e7; --tx-mut:#a3a3a3; --tx-dim:#6b6b6b;
  }
  html[data-theme=light]{--bg:#E8E6E1;--panel:#F0EEEA;--sunken:#DED9D2;--line:#d4cfc6;--line2:#c9c3b8;--tx:#20201c;--tx-mut:#5c574e;--tx-dim:#8a8478;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:Geist,-apple-system,system-ui,sans-serif;font-size:13px;
       display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:22px 16px 40px;gap:14px}
  .mono{font-family:"Geist Mono",ui-monospace,"SF Mono",monospace}
  .toolbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .tb{background:var(--sunken);border:1px solid var(--line);color:var(--tx-mut);border-radius:7px;padding:5px 9px;font:inherit;font-size:11px;cursor:pointer}
  .hint{color:var(--tx-dim);font-size:11px;max-width:420px;text-align:center;line-height:1.5}
  .hint b{color:var(--brand-600)}

  .panel{width:404px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;position:relative;
         box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .ph{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .ph .t{font-weight:700;letter-spacing:.06em;font-size:12px}
  .ph .sub{color:var(--tx-dim);font-size:11px}
  .ph .sp{margin-left:auto}
  .ph .icon{color:var(--tx-dim);cursor:pointer;display:inline-flex;padding:4px;border-radius:6px;position:relative}
  .ph .icon:hover{color:var(--tx);background:var(--sunken)}
  .ph .icon.act{color:var(--brand-600)}
  .belldot{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--brand)}
  .body{padding:12px 14px 4px}

  .src{font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;color:#fff;letter-spacing:.03em}
  .src.LN{background:#5b5be6}.src.GH{background:#3f3f46}
  .tid{color:var(--tx-mut);font-weight:600;font-size:11px}
  .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}

  /* input box: chips (tickets + attachments) + textarea; paste/drop target */
  .whatbox{background:var(--sunken);border:1px solid var(--line2);border-radius:10px;padding:8px 9px;transition:border-color .1s}
  .whatbox:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
  .whatbox.drag{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring);background:rgba(163,230,53,.05)}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chips:not(:empty){margin-bottom:7px}
  .tchip{display:flex;align-items:center;gap:6px;background:#181818;border:1px solid var(--line2);border-radius:7px;padding:4px 7px;max-width:100%}
  html[data-theme=light] .tchip{background:#e4dfd6}
  .tchip .rm{color:var(--tx-dim);cursor:pointer;font-size:11px;margin-left:2px}
  .achip{display:flex;align-items:center;gap:6px;background:#181818;border:1px solid var(--line2);border-radius:7px;padding:3px 6px 3px 3px}
  html[data-theme=light] .achip{background:#e4dfd6}
  .thumb{width:26px;height:26px;border-radius:5px;object-fit:cover;background:#333;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#bbb;flex:0 0 auto}
  .achip .nm{font-size:11px;color:var(--tx-mut);max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctxa{width:100%;min-height:42px;resize:vertical;background:transparent;border:0;color:var(--tx);font-family:inherit;font-size:12.5px;outline:none;padding:2px}
  .ctxa::placeholder{color:var(--tx-dim)}
  .boxbar{display:flex;align-items:center;gap:4px;margin-top:5px;padding-top:6px;border-top:1px solid var(--line)}
  .ib{display:inline-flex;align-items:center;gap:4px;color:var(--tx-dim);cursor:pointer;font-size:11px;padding:3px 6px;border-radius:6px}
  .ib:hover{color:var(--tx);background:#181818}

  .wactions{display:flex;gap:8px;margin-top:8px;align-items:center}
  .gbtn{display:inline-flex;align-items:center;gap:5px;background:var(--sunken);border:1px solid var(--line2);border-radius:7px;padding:5px 9px;color:var(--tx-mut);font-size:11.5px;cursor:pointer;font-weight:600}
  .gbtn:hover{border-color:var(--brand-600);color:var(--tx)}
  .gbtn.accent{color:var(--brand-600);border-color:rgba(163,230,53,.35)}
  .suggest{margin-top:6px;display:flex;flex-direction:column;gap:2px}
  .sug{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:7px;cursor:pointer}
  .sug:hover{background:#161616}
  .pri{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .pri.urgent{background:var(--fail)}.pri.high{background:var(--wait)}.pri.med{background:var(--idle)}
  .tag{font-size:9px;font-weight:700;color:var(--fail);border:1px solid var(--fail);border-radius:4px;padding:0 4px}
  .sug .pl{margin-left:auto;color:var(--tx-dim);font-size:14px}

  /* express summary line */
  .summary{display:flex;align-items:center;gap:8px;margin-top:12px;padding:9px 11px;background:var(--sunken);border:1px solid var(--line2);border-radius:9px;cursor:pointer}
  .summary:hover{border-color:var(--line2)}
  .summary .dot{width:7px;height:7px;border-radius:50%;background:var(--run)}
  .summary .txt{font-size:12px}
  .summary .txt b{font-weight:600}
  .summary .cfg{margin-left:auto;color:var(--brand-600);font-size:11px;display:flex;align-items:center;gap:4px}

  /* expanded rows */
  .rows{margin-top:6px}
  .row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .row .lbl{width:60px;flex:0 0 60px;color:var(--tx-mut);font-size:11.5px;font-weight:600;padding-top:5px}
  .row .ctl{flex:1;min-width:0}
  .sub2{color:var(--tx-dim);font-size:10.5px;margin-top:4px}
  .collapse{color:var(--brand-600);font-size:11px;cursor:pointer;margin-top:8px;display:inline-flex;gap:4px;align-items:center}

  .seg{display:inline-flex;background:var(--sunken);border:1px solid var(--line2);border-radius:8px;padding:2px}
  .seg button{border:0;background:transparent;color:var(--tx-mut);padding:5px 10px;border-radius:6px;cursor:pointer;font:inherit;font-size:12px;font-weight:600}
  .seg button.on{background:var(--brand);color:#0a0a0a}

  .agents{display:flex;flex-wrap:wrap;gap:5px}
  .apill{display:inline-flex;align-items:center;gap:6px;background:var(--sunken);border:1px solid var(--line2);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:12px;color:var(--tx-mut);font-weight:600}
  .apill .d{width:8px;height:8px;border-radius:3px;flex:0 0 auto}
  .apill.on{border-color:var(--brand);color:var(--tx);background:var(--brand-ring)}
  .apill.out{opacity:.45}.apill.out .lk{font-size:9px;color:var(--tx-dim)}
  .agsub{color:var(--tx-dim);font-size:10.5px;margin-top:6px}.agsub b{color:var(--tx-mut);font-weight:600}
  .agsub .si{color:var(--run)}.agsub .no{color:var(--wait)}

  /* dropdown w/ load */
  .dd{position:relative}
  .dd-btn{display:flex;align-items:center;gap:8px;width:100%;background:var(--sunken);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--tx);font:inherit;font-size:12.5px}
  .dd-btn .caret{margin-left:auto;color:var(--tx-dim)}
  .dd-btn .dot{width:7px;height:7px;border-radius:50%;background:var(--run);flex:0 0 auto}
  .dd-btn .dot.off{background:var(--idle)}
  .dd-menu{position:absolute;z-index:9;left:0;right:0;top:calc(100% + 5px);background:#0f0f0f;border:1px solid var(--line2);border-radius:10px;padding:5px;box-shadow:0 16px 40px rgba(0,0,0,.6);display:none}
  html[data-theme=light] .dd-menu{background:#f6f4f0}
  .dd.open .dd-menu{display:block}
  .opt{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer}
  .opt:hover{background:#181818}html[data-theme=light] .opt:hover{background:#e4dfd6}
  .opt.sel{background:var(--brand-ring)}
  .opt.dis{opacity:.4;cursor:not-allowed}
  .opt .dot{width:7px;height:7px;border-radius:50%;background:var(--run)}.opt .dot.off{background:var(--idle)}
  .opt.cloud .dot{background:#a78bfa}
  .opt .nm{font-size:12.5px}
  .opt .right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .loadbar{display:inline-flex;gap:2px}
  .loadbar i{width:4px;height:11px;border-radius:1px;background:#333}
  html[data-theme=light] .loadbar i{background:#cfc9be}
  .loadbar i.f{background:var(--wait)}.loadbar i.hot{background:var(--fail)}
  .loadtxt{font-size:10px;color:var(--tx-dim);min-width:52px;text-align:right}
  .loadtxt.busy{color:var(--wait)}.loadtxt.free{color:var(--run)}
  .use{color:var(--tx-dim);font-size:10px}
  .badge{color:var(--brand-600);font-size:9px;font-weight:700;border:1px solid var(--brand-600);border-radius:4px;padding:0 4px}
  .badge.used{color:var(--tx-dim);border-color:var(--line2)}
  .dd-sec{color:var(--tx-dim);font-size:9.5px;letter-spacing:.08em;padding:6px 9px 3px;font-weight:700}

  .modehint{color:var(--tx-dim);font-size:10.5px;margin-top:5px;line-height:1.45}.modehint b{color:var(--wait)}
  .nudge{display:flex;gap:7px;align-items:center;background:rgba(212,167,44,.09);border:1px solid rgba(212,167,44,.3);border-radius:8px;padding:7px 9px;color:var(--wait);font-size:11px;margin-top:7px;line-height:1.4}
  .nudge .go{margin-left:auto;color:var(--brand-600);cursor:pointer;font-weight:600;white-space:nowrap}

  .adv-h{display:flex;align-items:center;gap:6px;color:var(--tx-mut);cursor:pointer;padding:10px 0 0;font-size:11.5px;font-weight:600;border-top:1px solid var(--line);margin-top:2px}
  .adv.open .adv-h .c{transform:rotate(90deg)}.adv-h .c{transition:transform .12s}
  .adv-body{display:none;padding-top:8px}.adv.open .adv-body{display:block}
  .field{margin:9px 0}.field .k{color:var(--tx-mut);font-size:11px;margin-bottom:4px;font-weight:600}
  .field input{width:100%;background:var(--sunken);border:1px solid var(--line2);border-radius:7px;color:var(--tx);padding:7px 9px;font:inherit;font-size:12px;outline:none}

  /* batch */
  .batch{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;background:var(--sunken);border:1px solid var(--line2);border-radius:9px;font-size:11.5px;color:var(--tx-mut)}

  /* footer */
  .foot{padding:11px 14px;border-top:1px solid var(--line)}
  .disp{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#0a0a0a;border:0;border-radius:9px;padding:11px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
  .disp:hover{background:var(--brand-600)}
  .disp .kbd{background:rgba(10,10,10,.16);border-radius:5px;padding:1px 6px;font-size:11px;margin-left:2px}
  .warn{display:flex;gap:7px;align-items:flex-start;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.32);border-radius:8px;padding:8px 10px;color:var(--fail);font-size:11px;margin-top:8px}

  /* bell popover */
  .bellpop{position:absolute;z-index:20;top:44px;right:12px;width:250px;background:#0f0f0f;border:1px solid var(--line2);border-radius:12px;padding:10px;box-shadow:0 20px 50px rgba(0,0,0,.6);display:none}
  html[data-theme=light] .bellpop{background:#f6f4f0}
  .panel.bell .bellpop{display:block}
  .bp-h{display:flex;align-items:center;font-weight:700;font-size:12px;margin-bottom:6px}
  .bp-h .dnd{margin-left:auto;font-size:10px;color:var(--tx-dim);display:flex;gap:6px;align-items:center;cursor:pointer}
  .bp-sec{color:var(--tx-dim);font-size:9.5px;letter-spacing:.06em;font-weight:700;margin:8px 0 3px}
  .chk{display:flex;align-items:center;gap:8px;padding:4px 2px;font-size:12px;color:var(--tx-mut);cursor:pointer}
  .box{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line2);flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#0a0a0a}
  .chk.on .box{background:var(--brand);border-color:var(--brand)}
  .chk .em{color:var(--fail);font-weight:600}
  .chan{display:flex;gap:5px;flex-wrap:wrap}
  .chan .c{border:1px solid var(--line2);border-radius:7px;padding:4px 9px;font-size:11px;color:var(--tx-mut);cursor:pointer}
  .chan .c.on{border-color:var(--brand);color:var(--tx);background:var(--brand-ring)}
  .sw{width:30px;height:17px;border-radius:9px;background:var(--line2);position:relative;cursor:pointer;flex:0 0 auto;transition:.12s}
  .sw.on{background:var(--brand)}.sw i{position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:.12s}.sw.on i{left:15px}
</style>
</head>
<body>
  <div class="toolbar">
    <button class="tb" id="theme">theme</button>
    <button class="tb" id="texpand">toggle: expand config</button>
    <button class="tb" id="tcloud">set host: Rush Cloud</button>
    <button class="tb" id="tbatch">attach 2nd ticket (batch)</button>
    <button class="tb" id="tbell">toggle bell menu</button>
    <button class="tb" id="tshot">simulate screenshot paste</button>
  </div>

  <div class="panel" id="panel">
    <div class="ph">
      <span class="t">DISPATCH</span><span class="sub" id="phsub"></span>
      <span class="sp"></span>
      <span class="icon" id="bell" title="Notifications">🔔<span class="belldot" id="belldot"></span></span>
      <span class="icon" id="close">✕</span>
    </div>
    <div class="body" id="body"></div>
    <div class="foot" id="foot"></div>
    <div class="bellpop" id="bellpop"></div>
  </div>

  <div class="hint" id="hint"></div>

<script>
// ---------- data (from `agents view` + session index + live host poll) ----------
const AGENTS=[
  {id:"claude",name:"Claude",color:"#d97757",signedIn:true,ver:"2.1.181",def:true},
  {id:"codex",name:"Codex",color:"#cfcfcf",signedIn:true,ver:"0.134.0"},
  {id:"kimi",name:"Kimi",color:"#7c5cff",signedIn:true,ver:"0.12.1"},
  {id:"opencode",name:"OpenCode",color:"#f0b429",signedIn:false,ver:"1.16.0"},
  {id:"antigravity",name:"Antigravity",color:"#5b8def",signedIn:false,ver:"1.0.6"},
  {id:"grok",name:"Grok",color:"#9aa0a6",signedIn:false,ver:"0.2.32"},
  {id:"droid",name:"Droid",color:"#22c55e",signedIn:false,ver:"0.159.1"},
];
const agentById=id=>AGENTS.find(a=>a.id===id);
// hosts carry LIVE load now: agents running + load state (idle/free/busy/hot)
const HOSTS=[
  {id:"this-mac",label:"this-mac",kind:"local",online:true,uses:89,agents:4,load:"busy"},
  {id:"yosemite-s0",label:"yosemite-s0",kind:"remote",online:true,uses:34,agents:1,load:"free"},
  {id:"yosemite-s1",label:"yosemite-s1",kind:"remote",online:true,uses:12,agents:0,load:"idle"},
  {id:"zion",label:"zion",kind:"remote",online:false,uses:6,agents:0,load:"off"},
  {id:"rush",label:"Rush Cloud",kind:"cloud",online:true,uses:21},
  {id:"codex",label:"Codex Cloud",kind:"cloud",online:true,uses:4},
];
const hostById=id=>HOSTS.find(h=>h.id===id);
const isCloud=()=>hostById(S.host).kind==="cloud";
// suggested = least-busy online machine
const suggestedHost=()=>HOSTS.filter(h=>h.kind!=="cloud"&&h.online).sort((a,b)=>a.agents-b.agents)[0];
const PROJECTS=[
  {id:"swarmify",label:"swarmify",path:"~/src/github.com/muqsitnawaz/swarmify",uses:47},
  {id:"prix-api",label:"prix-api",path:"~/src/prix/api",uses:23},
  {id:"phoenix-horizon",label:"phoenix-horizon",path:"~/src/phoenix",uses:12},
];
const REPOS=[{id:"muqsitnawaz/swarmify",label:"muqsitnawaz/swarmify",uses:31},{id:"phnx-labs/prix",label:"phnx-labs/prix",uses:15}];
const TICKETS=[
  {src:"LN",id:"RUSH-1302",title:"Plugin-provided MCP servers never wired to MCPManager",pri:"urgent",bug:true},
  {src:"LN",id:"RUSH-1301",title:"Destructive commands hard-delete — soft-delete to trash",pri:"urgent",bug:true},
  {src:"LN",id:"RUSH-1300",title:"Exit-code sweep — ~15 commands exit 0 on failure",pri:"urgent",bug:true},
  {src:"GH",id:"#412",title:"Webview shows a blank panel on reload",pri:"high",bug:true},
];
const PRI_RANK={urgent:0,high:1,med:2,low:3};
const ticketScore=t=>PRI_RANK[t.pri]*2+(t.bug?0:1);
const ticketById=id=>TICKETS.find(t=>t.id===id);
const WD={off:"No auto-nudge",keep:"Nudges if idle, pings you if stuck",handsoff:"Nudges to keep going, only pings on finish/fail"};

let S={ prompt:"", attached:["RUSH-1302"], attachments:[], agent:"claude", host:"this-mac", project:"swarmify",
  repo:"muqsitnawaz/swarmify", mode:"auto", watchdog:"keep", expanded:false, batch:"all",
  notify:{events:{stall:true,question:true,plan:true,finish:true,fail:true}, channel:"imessage", dnd:false} };

// ---------- input (chips + attachments + context) ----------
function suggestionsHtml(){
  const q=S.prompt.trim().toLowerCase();
  return TICKETS.filter(t=>!S.attached.includes(t.id)&&(!q||(t.id+' '+t.title).toLowerCase().includes(q)))
    .sort((a,b)=>ticketScore(a)-ticketScore(b)).slice(0,3)
    .map(t=>`<div class="sug" data-add="${t.id}"><span class="pri ${t.pri}"></span><span class="src ${t.src}">${t.src}</span>
      <span class="tid">${t.id}</span><span class="tt">${t.title}</span>${t.bug?'<span class="tag">bug</span>':''}<span class="pl">+</span></div>`).join("");
}
function whatHtml(){
  const chips=S.attached.map(id=>{const t=ticketById(id);return t?`<span class="tchip"><span class="src ${t.src}">${t.src}</span>
    <span class="tid">${t.id}</span><span class="tt">${t.title}</span><span class="rm" data-rm="${id}">✕</span></span>`:''}).join("")
    + S.attachments.map((a,i)=>`<span class="achip"><span class="thumb">${a.type==='image'?'🖼':'📄'}</span>
      <span class="nm">${a.name}</span><span class="rm" data-rma="${i}">✕</span></span>`).join("");
  return `<div class="whatbox" id="whatbox">
      <div class="chips">${chips}</div>
      <textarea class="ctxa" id="ctxa" placeholder="What should the agent do?  Paste a screenshot, drop files, or @mention code for context.">${S.prompt}</textarea>
      <div class="boxbar">
        <span class="ib" id="attachFile">📎 Attach</span>
        <span class="ib" id="pasteShot">🖼 Paste screenshot</span>
        <span class="ib">@ Mention code</span>
      </div>
    </div>
    <div class="wactions">
      <span class="gbtn accent" id="autopick">⚡ Auto-pick urgent</span>
      <span class="sub2" style="align-self:center">or attach from suggestions</span>
    </div>
    <div class="suggest" id="suggest">${suggestionsHtml()}</div>`;
}

// ---------- host dropdown with live load ----------
function loadBar(h){
  const n=Math.min(5,h.agents||0); let s="";
  for(let i=0;i<5;i++){const cls=i<n?(h.load==='busy'?'f':(h.load==='hot'?'hot':'f')):'';s+=`<i class="${i<n?cls:''}"></i>`;}
  return `<span class="loadbar">${s}</span>`;
}
function hostRight(h){
  if(h.kind==='cloud') return `<span class="use">${h.id==='rush'?'~$0.40/run':'usage 60%'}</span>`;
  if(!h.online) return `<span class="loadtxt busy">offline</span>`;
  const st=h.load==='idle'?'idle':h.load==='free'?`${h.agents} agent · free`:`${h.agents} agents · busy`;
  return `${loadBar(h)}<span class="loadtxt ${h.load==='busy'?'busy':'free'}">${st}</span>`;
}
function renderHost(){
  const ctl=document.getElementById("hostCtl"); const sel=hostById(S.host); const sug=suggestedHost();
  const rowsHtml=arr=>arr.map(h=>`<div class="opt ${h.id===sel.id?'sel':''} ${h.kind==='cloud'?'cloud':''} ${(!h.online)?'dis':''}" data-id="${h.id}">
      <span class="dot ${h.online?'':'off'}"></span><span class="nm">${h.label}</span>
      ${h.id===sug.id?'<span class="badge">SUGGESTED</span>':(h.id==='this-mac'?'<span class="badge used">MOST USED</span>':'')}
      <span class="right">${hostRight(h)}</span></div>`).join("");
  const local=HOSTS.filter(h=>h.kind!=='cloud'), cloud=HOSTS.filter(h=>h.kind==='cloud');
  const menu=`<div class="dd-sec">MACHINES</div>${rowsHtml(local)}<div class="dd-sec">CLOUD</div>${rowsHtml(cloud)}`;
  const busy=sel.kind!=='cloud'&&sel.online&&sel.load==='busy';
  ctl.innerHTML=`<div class="dd"><button class="dd-btn"><span class="dot ${sel.online?'':'off'}"></span><span>${sel.label}</span>
      <span class="right">${sel.kind==='cloud'?'':hostRight(sel)}</span><span class="caret">▾</span></button><div class="dd-menu">${menu}</div></div>
    <div class="sub2">${isCloud()?'Cloud runs a fresh clone — local uncommitted changes are not included.':(sel.kind==='remote'?'Runs over SSH on '+sel.label:'Runs on this machine')}</div>
    ${busy?`<div class="nudge">⚠ ${sel.label} has ${sel.agents} agents running — may slow your other apps.<span class="go" data-swap="${sug.id}">Run on ${sug.label} (free)</span></div>`:''}`;
  const root=ctl.querySelector(".dd");
  ctl.querySelector(".dd-btn").onclick=e=>{e.stopPropagation();document.querySelectorAll(".dd.open").forEach(d=>d!==root&&d.classList.remove("open"));root.classList.toggle("open");};
  ctl.querySelectorAll(".opt:not(.dis)").forEach(o=>o.onclick=()=>{S.host=o.dataset.id;render();});
  const sw=ctl.querySelector("[data-swap]"); if(sw)sw.onclick=()=>{S.host=sw.dataset.swap;render();};
}
function renderProject(){
  const ctl=document.getElementById("projCtl"); const cloud=isCloud();
  document.getElementById("projLbl").textContent=cloud?"Repo":"Project";
  const items=cloud?REPOS:PROJECTS; const selId=cloud?S.repo:S.project; const sel=items.find(i=>i.id===selId)||items[0];
  const top=[...items].sort((a,b)=>b.uses-a.uses)[0];
  const menu=[...items].sort((a,b)=>b.uses-a.uses).map(i=>`<div class="opt ${i.id===sel.id?'sel':''}" data-id="${i.id}">
      <span class="nm">${i.label}</span>${i.id===top.id?'<span class="badge used">MOST USED</span>':''}<span class="right"><span class="use">${i.uses}×</span></span></div>`).join("");
  ctl.innerHTML=`<div class="dd"><button class="dd-btn"><span>${sel.label}</span><span class="caret" style="margin-left:auto">▾</span></button><div class="dd-menu">${menu}</div></div>
    ${cloud?'':`<div class="sub2 mono">${sel.path}</div>`}`;
  const root=ctl.querySelector(".dd");
  ctl.querySelector(".dd-btn").onclick=e=>{e.stopPropagation();document.querySelectorAll(".dd.open").forEach(d=>d!==root&&d.classList.remove("open"));root.classList.toggle("open");};
  ctl.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{if(cloud)S.repo=o.dataset.id;else S.project=o.dataset.id;render();});
}
function renderAgent(){
  const ctl=document.getElementById("agentCtl"); const a=agentById(S.agent);
  ctl.innerHTML=`<div class="agents">${AGENTS.map(g=>`<span class="apill ${g.id===S.agent?'on':''} ${g.signedIn?'':'out'}" data-ag="${g.id}">
    <span class="d" style="background:${g.color}"></span>${g.name}${g.signedIn?'':'<span class="lk">·sign in</span>'}</span>`).join("")}</div>
    <div class="agsub"><b>${a.name}</b> · ${a.ver}${a.def?' · default':''} · ${a.signedIn?'<span class="si">signed in</span>':`<span class="no">not signed in — agents add ${a.id}</span>`}</div>`;
  ctl.querySelectorAll("[data-ag]").forEach(p=>p.onclick=()=>{S.agent=p.dataset.ag;render();});
}

// ---------- expanded config ----------
function expandedHtml(){
  return `<div class="rows">
    <div class="row"><span class="lbl">Agent</span><span class="ctl" id="agentCtl"></span></div>
    <div class="row"><span class="lbl">Run on</span><span class="ctl" id="hostCtl"></span></div>
    <div class="row"><span class="lbl" id="projLbl">Project</span><span class="ctl" id="projCtl"></span></div>
    <div class="row"><span class="lbl">Mode</span><span class="ctl">
      <span class="seg" id="modeSeg"><button data-m="plan">Plan</button><button data-m="auto">Auto</button><button data-m="edit">Edit</button></span>
      <div class="modehint" id="modehint"></div></span></div>
    <div class="row"><span class="lbl">Watchdog</span><span class="ctl">
      <span class="seg" id="wdSeg"><button data-w="off">Off</button><button data-w="keep">Keep moving</button><button data-w="handsoff">Hands-off</button></span>
      <div class="modehint" id="wdhint"></div></span></div>
    <div class="adv" id="adv"><div class="adv-h" id="advH"><span class="c">▸</span> More options</div>
      <div class="adv-body">
        <div class="field" id="branchField" style="display:none"><div class="k">Branch</div><input value="auto (new branch)"/></div>
        <div class="field"><div class="k">Repos / extra context passed to the agent</div><input placeholder="optional"/></div>
      </div></div>
    <div class="collapse" id="collapse">⌃ Hide config</div>
  </div>`;
}
function wireExpanded(){
  renderAgent(); renderHost(); renderProject();
  document.querySelectorAll("#modeSeg button").forEach(b=>{b.classList.toggle("on",b.dataset.m===S.mode);b.onclick=()=>{S.mode=b.dataset.m;render();};});
  document.getElementById("modehint").innerHTML = S.mode==="plan"?'Read-only. Cannot edit files or run commands until you approve.'
    : S.mode==="auto"?'Runs safe steps itself, <b>asks before anything risky</b> — deletes, pushes, installs.'
    : 'Full access — edits files and runs commands without asking.';
  document.querySelectorAll("#wdSeg button").forEach(b=>{b.classList.toggle("on",b.dataset.w===S.watchdog);b.onclick=()=>{S.watchdog=b.dataset.w;render();};});
  document.getElementById("wdhint").innerHTML = S.watchdog==='keep'
    ? 'If it stalls, auto-nudge it. If it\'s stuck after 2 tries, <b>ping you</b>.'
    : WD[S.watchdog];
  document.getElementById("branchField").style.display=isCloud()?"block":"none";
  document.getElementById("advH").onclick=()=>document.getElementById("adv").classList.toggle("open");
  document.getElementById("collapse").onclick=()=>{S.expanded=false;render();};
}

// ---------- bell popover ----------
function renderBell(){
  const ev=S.notify.events; const chk=(k,label,em)=>`<div class="chk ${ev[k]?'on':''}" data-ev="${k}"><span class="box">${ev[k]?'✓':''}</span><span class="${em?'em':''}">${label}</span></div>`;
  document.getElementById("bellpop").innerHTML=`
    <div class="bp-h">🔔 Notify me <span class="dnd" id="dnd"><span class="sw ${S.notify.dnd?'on':''}"><i></i></span> DND</span></div>
    <div class="bp-sec">ON EVENTS</div>
    ${chk('stall','Stalled / stopped',true)}${chk('question','Needs input')}${chk('plan','Plan ready',true)}${chk('finish','Finished')}${chk('fail','Failed',true)}
    <div class="bp-sec">WHERE</div>
    <div class="chan">${['iMessage','Slack','Desktop'].map(c=>`<span class="c ${S.notify.channel===c.toLowerCase()?'on':''}" data-chan="${c.toLowerCase()}">${c}</span>`).join("")}<span class="c" data-chan="add">+ integration</span></div>
    <div class="bp-sec">QUIET HOURS</div><div class="chk"><span class="mono" style="color:var(--tx-mut)">10pm – 8am · queue non-urgent</span></div>`;
  document.getElementById("dnd").onclick=e=>{e.stopPropagation();S.notify.dnd=!S.notify.dnd;render();};
  document.querySelectorAll("[data-ev]").forEach(x=>x.onclick=e=>{e.stopPropagation();S.notify.events[x.dataset.ev]=!S.notify.events[x.dataset.ev];render();});
  document.querySelectorAll("[data-chan]").forEach(x=>x.onclick=e=>{e.stopPropagation();if(x.dataset.chan!=='add'){S.notify.channel=x.dataset.chan;render();}});
}

// ---------- render ----------
function render(){
  const body=document.getElementById("body"); const a=agentById(S.agent); const host=hostById(S.host);
  const summaryTxt=`<b>${a.name}</b> · ${isCloud()?S.repo:S.project} on ${host.label} · ${S.mode[0].toUpperCase()+S.mode.slice(1)}`;
  const batchHtml = S.attached.length>=2 ? `<div class="batch">Dispatch
      <span class="seg" id="batchSeg" style="margin-left:2px"><button data-b="all">1 agent, all ${S.attached.length}</button><button data-b="per">1 agent per ticket</button></span></div>` : '';
  body.innerHTML = whatHtml()
    + (S.expanded ? expandedHtml() : `<div class="summary" id="summary"><span class="dot"></span>
        <span class="txt">${summaryTxt}</span><span class="cfg">Configure ▾</span></div>`)
    + batchHtml;

  // wire input
  const box=document.getElementById("whatbox"); const ta=document.getElementById("ctxa");
  ta.oninput=()=>{S.prompt=ta.value;const s=document.getElementById("suggest");s.innerHTML=suggestionsHtml();wireSuggest();};
  ta.onkeydown=e=>{if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){e.preventDefault();doDispatch();}};
  box.addEventListener("dragover",e=>{e.preventDefault();box.classList.add("drag");});
  box.addEventListener("dragleave",()=>box.classList.remove("drag"));
  box.addEventListener("drop",e=>{e.preventDefault();box.classList.remove("drag");[...(e.dataTransfer?.files||[])].forEach(f=>S.attachments.push({type:f.type.startsWith('image')?'image':'file',name:f.name}));render();});
  box.addEventListener("paste",e=>{const items=[...(e.clipboardData?.items||[])];const img=items.find(i=>i.type.startsWith('image'));if(img){e.preventDefault();S.attachments.push({type:'image',name:'pasted-screenshot.png'});render();}});
  document.getElementById("pasteShot").onclick=()=>{S.attachments.push({type:'image',name:'Screenshot 2026-07-01.png'});render();};
  document.getElementById("attachFile").onclick=()=>{S.attachments.push({type:'file',name:'error-log.txt'});render();};
  document.querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>{S.attached=S.attached.filter(v=>v!==x.dataset.rm);render();});
  document.querySelectorAll("[data-rma]").forEach(x=>x.onclick=()=>{S.attachments.splice(+x.dataset.rma,1);render();});
  document.getElementById("autopick").onclick=()=>{const t=TICKETS.filter(t=>!S.attached.includes(t.id)).sort((a,b)=>ticketScore(a)-ticketScore(b))[0];if(t){S.attached.push(t.id);render();}};
  wireSuggest();
  if(S.expanded) wireExpanded();
  else document.getElementById("summary").onclick=()=>{S.expanded=true;render();};
  if(batchHtml) document.querySelectorAll("#batchSeg button").forEach(b=>{b.classList.toggle("on",b.dataset.b===S.batch);b.onclick=()=>{S.batch=b.dataset.b;render();};});

  // header
  document.getElementById("phsub").textContent = S.attached.length? `${S.attached.length} ticket${S.attached.length>1?'s':''} + context` : "new agent";
  document.getElementById("bell").classList.toggle("act", Object.values(S.notify.events).some(v=>!v)||S.notify.dnd);
  renderBell();
  // footer
  const nCount = (S.batch==='per'&&S.attached.length>=2)? S.attached.length : 1;
  const label = nCount>1? `Dispatch ${nCount} agents` : `Dispatch ${a.name} → ${isCloud()?S.repo:S.project}${S.mode!=='auto'?' · '+S.mode[0].toUpperCase()+S.mode.slice(1):''}`;
  document.getElementById("foot").innerHTML=`<button class="disp" id="dispBtn">⚡ ${label}<span class="kbd">⌘↵</span></button>
    ${a.signedIn?'':`<div class="warn">${a.name} isn't signed in — you'll be prompted to <b>agents add ${a.id}</b> first.</div>`}`;
  document.getElementById("dispBtn").onclick=doDispatch;
  document.getElementById("hint").innerHTML=`<b>Express by default</b> — one line, ⌘↵ to fire; click Configure for the full controls. <b>Run on</b> shows live load (agents running per host) and suggests the least-busy machine. <b>Watchdog</b> + the header <b>bell</b> handle silent stalls. Mode defaults to <b>Auto</b> (safe).`;
}
function wireSuggest(){document.querySelectorAll("[data-add]").forEach(x=>x.onclick=()=>{if(!S.attached.includes(x.dataset.add))S.attached.push(x.dataset.add);render();});}
function doDispatch(){const b=document.getElementById("dispBtn");if(b){b.textContent="✓ Dispatched";b.style.background="var(--brand-600)";}}

// controls
document.getElementById("theme").onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==="light"?"dark":"light";};
document.getElementById("texpand").onclick=()=>{S.expanded=!S.expanded;render();};
document.getElementById("tcloud").onclick=function(){S.host=isCloud()?"this-mac":"rush";render();};
document.getElementById("tbatch").onclick=()=>{if(!S.attached.includes("RUSH-1301"))S.attached.push("RUSH-1301");render();};
document.getElementById("tbell").onclick=e=>{e.stopPropagation();document.getElementById("panel").classList.toggle("bell");};
document.getElementById("tshot").onclick=()=>{S.attachments.push({type:'image',name:'Screenshot 2026-07-01.png'});render();};
document.getElementById("bell").onclick=e=>{e.stopPropagation();document.getElementById("panel").classList.toggle("bell");};
document.addEventListener("click",()=>{document.querySelectorAll(".dd.open").forEach(d=>d.classList.remove("open"));document.getElementById("panel").classList.remove("bell");});
document.getElementById("bellpop").addEventListener("click",e=>e.stopPropagation());
// screenshot hooks
const h=location.hash;
if(h.includes("expand"))S.expanded=true;
if(h.includes("cloud"))S.host="rush";
if(h.includes("batch"))S.attached=["RUSH-1302","RUSH-1301"];
render();
if(h.includes("bell"))document.getElementById("panel").classList.add("bell");
if(h.includes("hostopen")){document.querySelector("#hostCtl .dd")?.classList.add("open");}
if(!h)setTimeout(()=>document.getElementById("ctxa")?.focus(),50);
</script>
</body>
</html>
